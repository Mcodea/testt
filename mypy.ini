[mypy]
python_version = 3.12
ignore_missing_imports = True
show_error_codes = True
warn_unused_ignores = True
follow_imports = normal
check_untyped_defs = True

# Le contrat de type couvre le moteur ; les widgets Qt sont vérifiés par leur
# propre recette d'interface, sans entraîner leurs stubs dans ce périmètre.
[mypy-genvar_qt.*]
follow_imports = skip
