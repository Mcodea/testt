name: OGIAS CI

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ogias-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests et couverture (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - name: Bibliothèques système de Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install -r requirements-ci.lock
      - run: python -m pip check
      - name: PySide6 importable, aucun test Qt ignoré
        run: python -c "from PySide6 import QtCore, QtGui, QtWidgets, QtTest; print(QtCore.qVersion())"
      - name: Tests unitaires et intégration, aucune collecte vide
        run: python outils/ci.py python
      - name: Couverture moteur 85 %, exports industriels 100 %
        run: python outils/ci.py coverage
      - name: Résultats du lancement
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tests-${{ matrix.os }}
          path: artifacts/ci/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  web:
    name: Navigateur et performance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.ms-playwright
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - run: python -m pip install -r requirements-ci.lock
      - run: python -m playwright install --with-deps chromium
      - run: python outils/ci.py web --managed-browser
      - name: Banc bloquant, 300 équipements et 5000 variables
        run: python outils/ci.py performance
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: navigateur-performance
          path: artifacts/ci/
          if-no-files-found: error
          retention-days: 14

  quality:
    name: Statique, types, dépendances et données
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24.22.1"
      - run: python -m pip install -r requirements-ci.lock
      - run: python outils/ci.py static
      - name: Audit sans vulnérabilité ignorée
        if: always()
        run: python outils/ci.py audit
      - name: Contrôle anti-données réelles
        if: always()
        run: python outils/ci.py data
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qualite
          path: artifacts/ci/
          if-no-files-found: error
          retention-days: 14

  portable:
    name: Construction portable Windows
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.ms-playwright
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - run: python -m pip install -r requirements-ci.lock
      - name: Runtime embarqué, contrôle des données et empreinte
        run: python outils/construire_portable.py
      - run: python -m playwright install chromium
      - name: Essai du portable extrait avec son runtime et six scénarios navigateur
        shell: pwsh
        run: |
          $archive = Get-ChildItem artifacts/portable/OGIAS-*-windows-x64.zip | Select-Object -First 1
          python outils/tester_portable.py $archive.FullName --web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portable-windows-candidat
          path: |
            artifacts/portable/
            artifacts/ci-portable/
          if-no-files-found: error
          retention-days: 14
